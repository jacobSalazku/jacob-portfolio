query GetProjectBySlug($slug: String!) {
  allProject(where: { slug: { current: { eq: $slug } } }, limit: 1) {
    _id
    title
    slug {
      current
    }
    publishedAt
    mainImage {
      ...ImageFields
    }
    tags {
      ...TagFields
    }
    lede {
      nl
      en
      fr
    }
    role {
      nl
      en
      fr
    }
    timeline {
      nl
      en
      fr
    }
    projectType {
      nl
      en
      fr
    }
    languages
    liveUrl
    sourceUrl
    url
    sections {
      ...SectionFields
    }
    text {
      nlRaw
      enRaw
      frRaw
    }
    features {
      title {
        nl
        en
        fr
      }
      content {
        nlRaw
        enRaw
        frRaw
      }
    }
  }
}
